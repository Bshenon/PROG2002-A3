<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Events | Himalayan Hearts Foundation</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Himalayan Hearts Foundation</h1>

            <nav>
                <a href="index.html">Home</a>
                <a href="search.html">Search Events</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="search-section">

            <div class="container">

                <h2>Search Charity Events</h2>

                <p class="section-intro">
                    Find charity events by date, location or category.
                </p>

                <form id="search-form">

                    <div class="search-fields">

                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date">
                        </div>

                        <div class="form-group">
                            <label for="location">Location</label>
                            <input
                                type="text"
                                id="location"
                                placeholder="Enter a location">
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>

                            <select id="category">
                                <option value="">All Categories</option>
                            </select>
                        </div>

                    </div>

                    <div class="search-buttons">
                        <button type="submit" class="button">
                            Search Events
                        </button>

                        <button type="button" id="clear-button" class="secondary-button">
                            Clear Filters
                        </button>
                    </div>

                </form>

                <div id="message"></div>

                <div id="search-results"></div>

            </div>

        </section>

    </main>

    <footer>
        <div class="container">
            <p>Himalayan Hearts Foundation</p>
            <p>contact@himalayanhearts.org | 08 6123 4567</p>
        </div>
    </footer>

    <script src="js/search.js"></script>

</body>

</html>
